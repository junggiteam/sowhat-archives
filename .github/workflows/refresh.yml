name: Refresh So What archive site

on:
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sowhat-site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh crawlable HTML from the public archive feed
        run: python build_site.py --refresh
      - name: Save changed publications and request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add index.html data/sowhat_archive.json widgets/sowhat-archives-code.txt widgets/sowhat-archives-preview.html CNAME robots.txt sitemap.xml .nojekyll
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "junggiteam"
          git config user.email "junggiteam@gmail.com"
          git commit -m "Auto update: So What archive site"
          git pull --rebase origin main
          git push origin main
          gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '.status'
