name: Refresh So What archive site

# Started by the sowhat-cron Cloudflare Worker on Korean business days
# (16:10 16:30 16:50 17:10 17:40 18:10, and 09:10 to catch up). GitHub cron was
# unreliable (runs hours apart), so there is no schedule here.
on:
  # Temporary backup until the sowhat-cron GitHub key is installed; then removed.
  schedule:
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sowhat-site-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh crawlable HTML from the public archive feed
        run: python build_site.py --refresh
      - name: Check archive scoping and SEO metadata
        run: python -m unittest discover -s tests -v
      - name: Save changed publications and request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add index.html data/sowhat_archive.json widgets/sowhat-archives-code.txt widgets/sowhat-archives-preview.html CNAME robots.txt sitemap.xml .nojekyll [0-9][0-9][0-9][0-9]/*/index.html read/index.html category/*/index.html data/sowhat_sections.json
          if git diff --staged --quiet; then exit 0; fi
          git config user.name "junggiteam"
          git config user.email "junggiteam@gmail.com"
          git commit -m "Auto update: So What archive site"
          git pull --rebase origin main
          git push origin main
          gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '.status'
